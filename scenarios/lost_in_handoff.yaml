# SPDX-License-Identifier: Apache-2.0
# Lost in Handoff — measuring hop decay in multi-agent systems.
#
# Identical to shell_marketplace.yaml except for two lines:
#   - agents.template: auto      (selects the facts-card prompts)
#   - agents.llm_provider/model  (a real backend; see MOCK ARM below)
#
# The payload is the only edit. Topology, seed, layers, and task are unchanged.
#
# `template: auto` resolves `marketplace-<role>` via nest_shell/agent.py:204-208,
# i.e. templates/agents/marketplace-buyer.yaml and marketplace-seller.yaml.
#
# MOCK ARM IS EXCLUDED FROM RESULTS.
#   Setting llm_model: mock routes to MockLLMBackend (runner.py:120), which is
#   keyword-matched and returns the fixed literal "sold:product:50"
#   (nest_shell/llm.py:206-219). Any facts card fed to it is discarded, so the
#   classifier reports T2 = 1.0 at hop one BY CONSTRUCTION. That number is a
#   fixture artifact, not hop decay. Use mock only to validate wiring.
#
# CAVEAT recorded at design time, carried into the report:
#   runner.py:123 builds AnthropicBackend(model=model) with no max_tokens, so
#   the default 256 applies (llm.py:98). The card is sized to clear that, and
#   hop_decay.py buckets truncated payloads separately as UNSCORED.
#
# Verify::
#
#     export ANTHROPIC_API_KEY=...        # you set this, not the agent
#     nest run scenarios/lost_in_handoff.yaml
#     python scripts/hop_decay.py traces/lost_in_handoff.jsonl
name: lost_in_handoff
description: "Hop decay: 6 LLM-backed agents relay a structured facts card; measure per-hop preservation."

tier: 2
seed: 42

agents:
  count: 6
  brain: llm
  llm_provider: anthropic
  llm_model: claude-sonnet-4-6
  template: auto
  roles:
    - name: buyer
      count: 3
    - name: seller
      count: 3

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: score_average
  payments: prepaid_credits
  coordination: contract_net
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1
# NOTE: every layer above is resolved by the runner (runner.py:60-76) and then
# DROPPED — all six shell factories accept `plugins` and none read it. An
# LLM-brained scenario therefore runs with no trust, no datafacts, and no
# identity regardless of what this block says. Upstream defect; reported
# separately from the measurement.

task:
  type: marketplace
  config:
    rounds: 5

failures:
  message_drop: 0.0

duration: "ticks: 3000"

metrics:
  - success_rate
  - message_count

output:
  trace: ./traces/lost_in_handoff.jsonl
